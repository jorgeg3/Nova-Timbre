name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk TimbreNova.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TimbreNova-apk
          path: TimbreNova.apk
