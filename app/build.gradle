plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ec.novagimnasia.timbre'
    compileSdk 34

    defaultConfig {
        applicationId 'ec.novagimnasia.timbre'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.2'
    }

    signingConfigs {
        nova {
            storeFile file('nova.keystore')
            storePassword 'novatimbre'
            keyAlias 'nova'
            keyPassword 'novatimbre'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.nova
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.nova
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
